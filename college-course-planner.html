function rModal(){
  if(!S.modal)return'';

  if(S.modal==='update'){
    const st=S.update?.state;
    const fsaSupported=canUseFilePicker();
    const isLocalFile=location.protocol==='file:';
    const isHosted=location.protocol==='http:'||location.protocol==='https:';
    const runFile=currentFileName();
    const pathHint=runFile?`<div style="font-size:10px;color:var(--text3);margin-top:8px;padding:6px 9px;background:var(--surface2);border-radius:5px;line-height:1.4">Currently running: <code style="word-break:break-all">${esc(runFile)}</code><br><span style="opacity:.7">Save the download over <b>this exact file</b> in its folder (not Downloads).</span></div>`:'';
    const errLine=S.update?.error?`<p style="font-size:12px;color:#C00;line-height:1.45;margin-bottom:8px">${esc(S.update.error)}</p>`:'';
    let body='';
    if(st==='applied'){
      const savedAs=S.update.savedAs||'(unknown)';
      const mismatch=S.update.nameMismatch;
      const autoNote=S.update.autoTriggered?`<p style="font-size:11px;color:var(--green);line-height:1.45;margin-bottom:8px">Auto-update applied this version.</p>`:'';
      body=`${autoNote}<p style="font-size:13px;color:var(--green);line-height:1.45;margin-bottom:8px">✓ New version written to <code>${esc(savedAs)}</code>.</p>
        ${mismatch?`<p style="font-size:12px;color:#C00;background:#FEE;padding:7px 10px;border-radius:6px;line-height:1.45;margin-bottom:8px">⚠ The file you picked (<code>${esc(savedAs)}</code>) doesn't match the file this tab is running (<code>${esc(runFile)}</code>). Reloading won't help — open <code>${esc(savedAs)}</code> directly instead, or run Apply again and pick the right file.</p>`:`<p style="font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:8px">Click <b>Reload now</b> to run the new version. Your autosaved plan stays in this browser.</p>`}
        <p style="font-size:11px;color:var(--text3);line-height:1.45">After reload, this modal will show <b>"You are up to date on v${esc(S.update.latest||'?')}"</b> — that's how you'll know it worked.</p>`;
    }else if(st==='downloaded'){
      const dlAs=S.update.downloadedAs||'college-course-planner.html';
      const autoNote=S.update.autoTriggered?`<p style="font-size:11px;color:var(--green);line-height:1.45;margin-bottom:8px">Auto-update downloaded this version.</p>`:'';
      body=`${autoNote}<p style="font-size:13px;color:var(--green);line-height:1.45;margin-bottom:8px">📥 Downloaded <code>${esc(dlAs)}</code> — check your browser's download bar or Downloads folder.</p>
        <p style="font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:8px"><b>Move/replace</b> that file over your existing planner (same folder and name), then click <b>Reload now</b>. Your autosaved plan stays in this browser.</p>
        ${pathHint}`;
    }else if(st==='applying'||st==='verifying'){
      body=`<p style="font-size:13px;color:var(--text2);line-height:1.45">${st==='verifying'?'⏳ Verifying your update after reload…':'⏳ Fetching the latest version…'}</p>`;
    }else if(st==='verified'){
      body=`<p style="font-size:13px;color:var(--green);line-height:1.45;margin-bottom:8px">✓ ${updateLine()}</p>
        <p style="font-size:12px;color:var(--text2);line-height:1.45">GitHub latest: <b>v${esc(S.update.latest||'?')}</b>. Your plan data is unchanged.</p>`;
    }else if(st==='verify-failed'){
      const fileWarn=S.update.fileMismatch?`<p style="font-size:12px;color:#854F0B;background:var(--core-bg);padding:7px 10px;border-radius:6px;line-height:1.45;margin-bottom:8px">This tab is running <code>${esc(runFile)}</code> but you were updating <code>${esc(S.update.pendingRunFile)}</code> — open the replaced file directly.</p>`:'';
      body=`${errLine}<p style="font-size:13px;color:#C00;line-height:1.45;margin-bottom:8px">⚠ ${updateLine()}</p>
        ${fileWarn}
        <p style="font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:8px">Replace <code>${esc(runFile||'college-course-planner.html')}</code> with the downloaded file (same folder and name), then click <b>Reload now</b> to verify again.</p>
        ${pathHint}`;
    }else{
      const localWarn=isLocalFile&&!fsaSupported?`<p style="font-size:12px;color:#854F0B;background:var(--core-bg);padding:7px 10px;border-radius:6px;line-height:1.45;margin-bottom:8px">Local files can't be overwritten in-place from the browser. <b>Download update</b> saves a fresh copy — replace your existing file with it, then reload.</p>`:'';
      const hostedWarn=isHosted?`<p style="font-size:12px;color:#854F0B;background:var(--core-bg);padding:7px 10px;border-radius:6px;line-height:1.45;margin-bottom:8px">⚠ This tab is loaded from <code>${esc(location.protocol)}//…</code>, not a local file. You can't overwrite a hosted file from the browser — download the update and run it locally.</p>`:'';
      body=`${errLine}<p style="font-size:13px;color:var(--text2);line-height:1.45;margin-bottom:10px">${updateLine()}</p>
        ${localWarn}${hostedWarn}
        <p style="font-size:11px;color:var(--text3);line-height:1.45">${fsaSupported
          ?'Click <b>Apply update</b> — your browser will ask you to <b>pick your existing planner file</b> so the new version writes directly over it.'
          :'Click <b>Download update</b> to grab the new file, then replace your existing copy in the same folder.'}</p>
        ${pathHint}
        <p style="font-size:10px;color:var(--text3);margin-top:8px">Or <a href="${esc(DOWNLOAD_URL)}" target="_blank" rel="noopener">download from GitHub Releases</a> if the button doesn't work.</p>`;
    }
    const applyBtn=(st!=='applied'&&st!=='applying'&&st!=='downloaded'&&st!=='verified'&&st!=='verifying')
      ?`<button class="linkbtn p" data-a="apply-update">${fsaSupported?'Apply update':'Download update'}</button>`:'';
    const reloadBtn=(st==='applied'&&!S.update.nameMismatch)||st==='downloaded'||st==='verify-failed'
      ?`<button class="linkbtn p" onclick="reloadPlanner()">Reload now</button>`:'';
    const checkBtn=(st!=='applied'&&st!=='applying'&&st!=='verifying')
      ?`<button class="linkbtn" data-a="manual-update">Check again</button>`:'';
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:520px">
        <div class="mhdr"><h3>Planner Updates</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">${body}${updateSettingsHtml()}</div>
        <div class="mfooter">
          ${checkBtn}${applyBtn}${reloadBtn}
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='export'){
    const tab=S.modalTab||'code';
    const body=tab==='code'?`
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Includes all ${S.schedules.length} schedule(s). Anyone with the code can import your exact plans.</p>
      <textarea class="sta" id="share-code" readonly onclick="this.select()">${esc(encodeShare())}</textarea>
      <span class="copied" id="copy-badge">✓ Copied!</span>`:`
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Markdown version of the active schedule. Paste into an email, Discord, Notion, anywhere plaintext works.</p>
      <textarea class="sta" id="md-out" readonly onclick="this.select()" style="height:240px">${esc(toMarkdown())}</textarea>
      <span class="copied" id="copy-md-badge">✓ Copied!</span>`;
    return`<div class="mbk" id="mbk">
    <div class="modal" style="max-width:560px">
      <div class="mhdr"><h3>📤 Share schedule</h3><button class="mclose" data-a="close-modal">×</button></div>
      <div class="mbody">
        <div class="share-tabs">
          <button class="share-tab${tab==='code'?' on':''}" onclick="S.modalTab='code';render()">Share code</button>
          <button class="share-tab${tab==='md'?' on':''}" onclick="S.modalTab='md';render()">Markdown</button>
        </div>
        ${body}
      </div>
      <div class="mfooter">
        <button onclick="${tab==='md'?`copyText('md-out','copy-md-badge')`:`copyCode()`}" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">Copy</button>
        <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button>
      </div>
    </div></div>`;
  }

  if(S.modal==='import')return`<div class="mbk" id="mbk">
    <div class="modal" style="max-width:480px">
      <div class="mhdr"><h3>📥 Import schedules</h3><button class="mclose" data-a="close-modal">×</button></div>
      <div class="mbody">
        <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Paste a share code to load schedules. <strong>Replaces all current data.</strong></p>
        <textarea class="sta" id="import-code" placeholder="Paste share code here…"></textarea>
        <span id="import-err" style="font-size:11px;color:#C00;display:none">Invalid code.</span>
      </div>
      <div class="mfooter">
        <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Cancel</button>
        <button onclick="doImport()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">Import</button>
      </div>
    </div></div>`;

  if(S.modal==='reset')return`<div class="mbk" id="mbk">
    <div class="modal" style="max-width:400px">
      <div class="mhdr"><h3>⚠️ Reset everything?</h3><button class="mclose" data-a="close-modal">×</button></div>
      <div class="mbody"><p style="font-size:13px;color:var(--text2)">Deletes all schedules and restores the default ECE + Business Honors plan. A snapshot is saved first so you can recover from version history.</p></div>
      <div class="mfooter">
        <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Cancel</button>
        <button onclick="doReset()" style="padding:6px 14px;background:#C00;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">Reset Everything</button>
      </div>
    </div></div>`;

  if(S.modal==='schedules'){
    const items=S.schedules.map(sch=>{
      const all=sch.sems.flatMap(s=>s.courses);
      const cr=all.reduce((t,c)=>t+c.credits,0),done=all.filter(c=>c.done).length;
      const isAct=sch.id===S.activeId,isRen=S.renamingId===sch.id;
      return `<div class="si${isAct?' act':''}" onclick="schedRowClick('${sch.id}',event)" title="${isAct?'Active schedule':'Click to switch to this schedule'}">
        <div class="si-dot" style="background:${sch.color}"></div>
        <div class="si-info">
          ${isRen
            ?`<div class="si-name"><input id="ren-inp" value="${esc(sch.name)}" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')commitRename('${sch.id}');if(event.key==='Escape'){S.renamingId=null;render();}"></div>`
            :`<div class="si-name">${esc(sch.name)}</div>`}
          <div class="si-meta">${all.length} courses · ${cr}cr · ${done} done${sch.kind==='business'?` · track: ${esc(businessTrackLabel(sch))}`:sch.track?` · track: ${TRACKS[sch.track]?.short||sch.track}`:''}</div>
        </div>
        <div class="si-acts">
          ${isRen
            ?`<button class="sa" onclick="commitRename('${sch.id}')">Save</button>`
            :`<button class="sa" onclick="startRename('${sch.id}')">Rename</button>`}
          <button class="sa" onclick="dupSched('${sch.id}')">Duplicate</button>
          ${isAct?`<span class="sa act-badge">✓ Active</span>`:`<button class="sa" onclick="switchSched('${sch.id}')">Switch</button>`}
          ${S.schedules.length>1?`<button class="sa d" onclick="delSched('${sch.id}')">Delete</button>`:''}
        </div>
      </div>`;
    }).join('');
    return `<div class="mbk" id="mbk">
      <div class="modal" style="max-width:640px">
        <div class="mhdr">
          <h3>Saved Schedules</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <button onclick="newSched()" style="padding:4px 11px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px">+ New Schedule</button>
            <button class="mclose" data-a="close-modal">×</button>
          </div>
        </div>
        <div class="mbody"><div class="slist">${items}</div></div>
        <div class="mfooter">
          <span class="left">${S.schedules.length} schedule(s)</span>
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Done</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='compare-pick'){
    const others=S.schedules.filter(s=>s.id!==S.activeId);
    if(!others.length)return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:380px">
        <div class="mhdr"><h3>Compare Schedules</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <p style="color:var(--text2);font-size:13px">You need at least two schedules to compare.</p>
          <button onclick="newSched()" style="margin-top:12px;padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">+ New Schedule</button>
        </div>
        <div class="mfooter"><button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Cancel</button></div>
      </div>
    </div>`;
    const active=getAct();
    const items=others.map(s=>{
      const all=s.sems.flatMap(x=>x.courses);
      const cr=all.reduce((t,c)=>t+c.credits,0);
      const sel=S.cmpPickId===s.id;
      return `<div class="cpi${sel?' sel':''}" onclick="S.cmpPickId='${s.id}';render()">
        <div class="cpi-dot" style="background:${s.color}"></div>
        <div class="cpi-name">${esc(s.name)}</div>
        <div class="cpi-meta">${all.length} courses · ${cr}cr</div>
        ${sel?'<div style="font-size:16px;margin-top:5px;color:var(--accent)">✓</div>':''}
      </div>`;
    }).join('');
    return `<div class="mbk" id="mbk">
      <div class="modal" style="max-width:520px">
        <div class="mhdr"><h3>⇄ Compare with…</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <p style="font-size:12px;color:var(--text2);margin-bottom:12px"><strong>${esc(active?.name)}</strong> is schedule <span style="color:var(--accent);font-weight:600">A</span>. Pick one to compare against:</p>
          <div class="cpg">${items}</div>
        </div>
        <div class="mfooter">
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Cancel</button>
          <button onclick="startCmp()" style="padding:6px 16px;background:${S.cmpPickId?'var(--accent)':'var(--border2)'};color:${S.cmpPickId?'#fff':'var(--text3)'};border:none;border-radius:6px;cursor:pointer;font-size:12px">Compare →</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='gpa'){
    const p=gpaPanel();
    const fmt=g=>g.gpa==null?'—':g.gpa.toFixed(3);
    const target=parseFloat(S.gpaTarget);
    const remainCr=p.all.filter(c=>!c.done).reduce((t,c)=>t+c.credits,0);
    let targetRes='';
    if(!isNaN(target)&&target>=0&&target<=4){
      if(remainCr===0)targetRes='No remaining graded credits to project against.';
      else{
        const needed=(target*(p.overall.hrs+remainCr)-p.overall.pts)/remainCr;
        if(needed<=0)targetRes=`You are already at or above ${target.toFixed(2)}. Remaining courses can be any grade.`;
        else if(needed>4)targetRes=`Not reachable. Would need a ${needed.toFixed(2)} GPA across the remaining ${remainCr} credits.`;
        else targetRes=`Need a <b>${needed.toFixed(3)}</b> GPA across the remaining ${remainCr} credits to reach <b>${target.toFixed(2)}</b>.`;
      }
    }
    const rows=gradedRows().map(r=>{
      if(r.hdr)return`<div class="gpa-sec">${esc(r.hdr)}</div>`;
      const{sem,c}=r;
      const gOpts=GRADE_OPTS.map(g=>`<option value="${g}"${(c.grade||'')===g?' selected':''}>${g||'—'}</option>`).join('');
      return`<div class="gpa-row">
        <span class="gcode" style="color:${(CATS[c.cat]||CATS.OTHER).txt}">${esc(c.code)}</span>
        <span class="gname">${esc(c.name)}</span>
        <span class="gcr">${c.credits}cr</span>
        <select onchange="setGrade('${sem.id}','${c.id}',this.value)" ${c.done?'':'disabled title="Mark course done first"'}>${gOpts}</select>
      </div>`;
    }).join('');
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:720px">
        <div class="mhdr"><h3>📊 GPA Calculator</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <div class="gpa-stats">
            <div class="gpa-stat"><div class="v">${fmt(p.overall)}</div><div class="l">Overall GPA</div><div style="font-size:9px;color:var(--text3);margin-top:2px">${p.overall.hrs} credits graded</div></div>
            <div class="gpa-stat"><div class="v">${fmt(p.eceMajor)}</div><div class="l">ECE Major GPA</div><div style="font-size:9px;color:var(--text3);margin-top:2px">${p.eceMajor.hrs} cr · ECE courses only</div></div>
            <div class="gpa-stat"><div class="v">${fmt(p.biz)}</div><div class="l">Business GPA</div><div style="font-size:9px;color:var(--text3);margin-top:2px">${p.biz.hrs} cr · BHP courses only</div></div>
          </div>
          ${(()=>{const sg=gpaPerSem().filter(x=>x.g.hrs>0);return sg.length?`<div class="gpa-target" style="margin-bottom:14px"><div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Per-semester GPA</div>${sg.map(x=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px dashed var(--border)"><span>${esc(x.sem.label)}</span><span><b>${fmt(x.g)}</b> <span style="color:var(--text3)">${x.g.hrs}cr</span></span></div>`).join('')}</div>`:'';})()}
          <div class="gpa-target">
            <label>Target overall GPA: <input type="number" min="0" max="4" step="0.01" value="${esc(S.gpaTarget)}" oninput="S.gpaTarget=this.value;updateTarget()"> <span style="font-size:10px;color:var(--text3)">UT scale: A=4.0, A-=3.67, B+=3.33…</span></label>
            <div class="res" id="gpa-target-res">${targetRes||'<span style=\"color:var(--text3)\">Enter a target to see what GPA your remaining courses need.</span>'}</div>
          </div>
          <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">${rows||'<div class="empty">No courses to grade yet.</div>'}</div>
        </div>
        <div class="mfooter">
          <span class="left">Grades count toward GPA only when the course is marked done. CR/NC/Q/W/IP are excluded.</span>
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='search'){
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:600px">
        <div class="mhdr"><h3>🔎 Search across all schedules</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <input id="search-inp" autofocus placeholder="ECE 411, Operations Management…" value="${esc(S.searchQ)}" oninput="onSearchInput(this.value)" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid var(--border2);border-radius:7px;background:var(--surface2);color:var(--text);outline:none">
          <div id="search-results">${computeSearchResultsHtml()}</div>
        </div>
        <div class="mfooter"><button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button></div>
      </div>
    </div>`;
  }

  if(S.modal==='transcript'){
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:620px">
        <div class="mhdr"><h3>📝 Import from UT transcript</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <p style="font-size:12px;color:var(--text2);margin-bottom:6px">Paste your Academic Summary text (the whole table from the PDF works) or any line that contains a course code + grade. Matching courses in your plan are marked done with their grade.</p>
          <details style="margin-bottom:8px"><summary style="font-size:11px;color:var(--text3);cursor:pointer">Accepted formats</summary>
            <pre style="font-size:10px;color:var(--text3);background:var(--surface2);padding:7px 9px;border-radius:5px;margin-top:5px;line-height:1.4;white-space:pre-wrap">ECE 302H   3.0   A
B A 324H   BUSN COMM: ORAL/WRIT: HON   A-   2250   In residence   3.0   11.01
B A S353   INTERNSHIP IN BUSINESS ADMIN   Z   69138   Extension   3.0   0.00
GOV 310L   AMERICAN GOVERNMENT   CR   16210   Credit by exam   3.0   0.00</pre>
            <p style="font-size:10px;color:var(--text3);margin-top:4px">Multi-word departments (B A, A S), special prefixes (S353), and grades A+ through F, CR, NC, W, Q, IP, and Z are recognized.</p>
          </details>
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <button onclick="pasteTranscriptFromClipboard()" style="padding:4px 10px;font-size:11px;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;cursor:pointer;color:var(--text)">📋 Paste from clipboard</button>
            <button onclick="document.getElementById('transcript-in').value='';document.getElementById('transcript-result').innerHTML='';" style="padding:4px 10px;font-size:11px;background:transparent;border:1px solid var(--border2);border-radius:5px;cursor:pointer;color:var(--text3)">Clear</button>
          </div>
          <textarea id="transcript-in" placeholder="Paste your transcript here…" style="width:100%;min-height:180px;padding:9px;border:1px solid var(--border2);border-radius:7px;background:var(--surface2);color:var(--text);font-family:monospace;font-size:11px;outline:none;margin-bottom:8px"></textarea>
          <div id="transcript-result" style="font-size:12px;color:var(--text)"></div>
        </div>
        <div class="mfooter">
          <span class="left">A snapshot is taken before any changes apply.</span>
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button>
          <button onclick="runTranscriptImport()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">Apply</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='backup'){
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:480px">
        <div class="mhdr"><h3>💾 Backup &amp; restore</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Download all schedules as a JSON file you can save anywhere, or restore from a previously downloaded file. Restore replaces all current data; a snapshot is taken first.</p>
          <div style="display:flex;gap:10px;flex-direction:column">
            <button onclick="downloadBackup()" style="padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600">⬇ Download backup.json</button>
            <button onclick="pickRestoreFile()" style="padding:10px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:7px;cursor:pointer;font-size:13px">⬆ Restore from file…</button>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text2);cursor:pointer">
            <input type="checkbox" ${unloadWarnEnabled()?'checked':''} onchange="setUnloadWarn(this.checked)">
            Warn me before closing if I've edited the plan since my last backup
          </label>
        </div>
        <div class="mfooter"><button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button></div>
      </div>
    </div>`;
  }

  if(S.modal==='curriculum'){
    const cur=getAct();
    const cards=Object.entries(CURRICULUM_TEMPLATES).map(([k,t])=>`
      <div class="tk-card" onclick="applyCurriculum('${k}')">
        <div class="tk-name">${esc(t.label)}</div>
        <div class="tk-grad">Click to replace the active plan with this template.</div>
      </div>`).join('');
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:560px">
        <div class="mhdr"><h3>📚 Curriculum templates</h3><button class="mclose" data-a="close-modal">×</button></div>
        <div class="mbody">
          <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Swap the active plan for a different starting curriculum. Useful when you're switching majors or want to plan as a non-ECB student. A snapshot is saved first so you can recover.</p>
          <div class="tk-grid">${cards}</div>
        </div>
        <div class="mfooter"><button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button></div>
      </div>
    </div>`;
  }

  if(S.modal==='history'){
    const snaps=loadSnapshots();
    const body=snaps.length?snaps.map(s=>{
      const tot=s.data.schedules.reduce((t,sch)=>t+sch.sems.flatMap(x=>x.courses).length,0);
      const d=new Date(s.ts);
      return`<div class="hist-row">
        <div>
          <div class="hr-when">${d.toLocaleString()}</div>
          <div class="hr-sum">${s.data.schedules.length} schedule(s), ${tot} courses · ${esc(s.reason||'auto')}</div>
        </div>
        <div style="display:flex;gap:5px">
          <button onclick="restoreSnapshot(${s.ts})">Restore</button>
          <button onclick="deleteSnapshot(${s.ts})" style="color:#C00;border-color:#FCC">Delete</button>
        </div>
      </div>`;
    }).join(''):'<div class="sres-empty">No snapshots yet. They get saved automatically as you make changes.</div>';
    return`<div class="mbk" id="mbk">
      <div class="modal" style="max-width:560px">
        <div class="mhdr">
          <h3>🕒 Version History</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <button onclick="saveSnapshotNow('manual');render()" style="padding:4px 11px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px">Save Snapshot Now</button>
            <button class="mclose" data-a="close-modal">×</button>
          </div>
        </div>
        <div class="mbody">${body}</div>
        <div class="mfooter">
          <span class="left">Up to 20 snapshots kept. For finer rewind, press Ctrl+Z to undo.</span>
          <button data-a="close-modal" style="padding:6px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text)">Close</button>
        </div>
      </div>
    </div>`;
  }

  if(S.modal==='programs'){
    const cur=getAct();
    const active=new Set(programKeys(cur));
    const tab=S.programTab==='certificates'?'certificates':'minors';
    const q=(S.programQ||'').trim().toLowerCase();
    const list=UT_PROGRAMS_RAW[tab]||[];
    const filtered=q?list.filter(p=>p.name.toLowerCase().includes(q)||p.school.toLowerCase().includes(q)):list;
    const bySchool=new Map();
    for(const p of filtered){
      if(!bySchool.has(p.school))bySchool.set(p.school,[]);
      bySchool.get(p.school).push(p);
    }
    const activeKeys=[...active];
    let focus=S.programFocus&&active.has(S.programFocus)?S.programFocus:activeKeys[0]||null;
    const prog=programProgress(cur);
    const progBox=prog?`
      <div class="tk-prog" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12px">${esc(prog.label)}</b><span style="font-size:11px;color:var(--text2)">${prog.coreDone}/${prog.coreTotal} cores · ${prog.electDone}/${prog.electNeed} electives · ${prog.done}/${prog.total} done</span></div>
        <div class="tp-bar"><div class="tp-fill" style="width:${prog.total?Math.min(100,prog.done/prog.total*100):0}%"></div></div>
      </div>`:'';
    const focusTabs=activeKeys.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${activeKeys.map(k=>{
      const p=UT_PROGRAMS_BY_KEY[k];
      const on=focus===k;
      return`<button onclick="S.programFocus='${k}';render()" style="padding:4px 10px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid ${on?'var(--accent)':'var(--border2)'};background:${on?'var(--accent)':'var(--surface2)'};color:${on?'#fff':'var(--text)'}">${esc(p?.name||k)}</button>`;
    }).join('')}</div>`:'';
    let focusBox='';
    if(focus&&active.has(focus)){
      const det=programDetailProgress(focus,cur);
      const planSems=getAS();
      const codes=new Set(planSems.flatMap(s=>s.courses).map(x=>normTrackCode(x.code)));
      if(det?.req){
        const electAtMax=det.need?det.electHit>=det.need:false;
        const electRemain=det.need?Math.max(0,det.need-det.electHit):0;
        focusBox=`
          <div class="tk-prog" style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12px">${esc(det.prog.name)}</b><span style="font-size:11px;color:${electAtMax?'var(--accent)':'var(--text2)'}">${det.coreHit}/${det.coreTotal} cores · ${det.electHit}/${det.need} electives</span></div>
            <div class="tp-bar"><div class="tp-fill" style="width:${(det.coreTotal+det.need)?Math.min(100,(det.coreHit+Math.min(det.electHit,det.need))/(det.coreTotal+det.need)*100):0}%"></div></div>
            ${det.req.cores?.length?`<div class="tk-h">Required courses <span style="font-weight:400;color:var(--text3);text-transform:none;letter-spacing:0">— added to your plan</span></div>
            <div class="tk-list">${det.req.cores.map(c=>{
              const hit=codes.has(normTrackCode(c.code));
              return`<div class="${hit?'ok':'miss'}">${hit?'✓':'○'} ${esc(c.code)} — ${esc(c.name)}</div>`;
            }).join('')}</div>`:''}
            ${det.req.electives?.length?`<div class="tk-h" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span>Approved electives <span style="font-weight:400;color:var(--text3);text-transform:none;letter-spacing:0">— pick ${det.need}</span></span>
              ${det.electHit?`<button type="button" onclick="event.stopPropagation();clearProgramElectives('${esc(focus)}')" style="padding:2px 8px;font-size:10px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text2);cursor:pointer;flex-shrink:0">Clear electives</button>`:''}
            </div>
            <div class="tk-limit ${electAtMax?'full':'ok'}">${electAtMax?`Elective limit reached (${det.need} max). Deselect one to choose another.`:`${electRemain} elective slot${electRemain===1?'':'s'} remaining — click to toggle.`}</div>
            ${S.programMsg?`<div class="tk-flash">${esc(S.programMsg)}</div>`:''}
            <div class="tk-list" style="columns:2;column-gap:18px">${det.req.electives.map(e=>{
              const code=e.code;
              const on=isProgramElectiveOnPlan(planSems,code,focus);
              const dim=!on&&electAtMax;
              const cls=on?'ok pick':dim?'miss dim':'miss pick';
              const click=dim&&!on?'':`onclick="event.stopPropagation();toggleProgramElective('${esc(focus)}','${esc(code)}')" title="${on?'Click to remove':dim?'Limit reached — deselect one first':'Click to add'}"`;

// ─── Main render ──────────────────────────────────────────────────────────────
function render(){

  // jump the user back to the top every time they pick a grade.
  const prevModalScroll=document.querySelector('.mbody')?.scrollTop||0;
  const act=getAct();
  const sems=getAS();
  const all=sems.flatMap(s=>s.courses);
  const reqAll=all.filter(isRequired);
  const addAll=all.filter(c=>!isRequired(c));
  const sumCr=arr=>arr.reduce((t,c)=>t+Number(c.credits||0),0);
  const reqTotalCr=sumCr(reqAll),reqDoneCr=sumCr(reqAll.filter(c=>c.done));
  const addTotalCr=sumCr(addAll),addDoneCr=sumCr(addAll.filter(c=>c.done));
  const total=all.length,done=all.filter(c=>c.done).length;
  const pct=reqTotalCr?Math.round(reqDoneCr/reqTotalCr*100):(total?Math.round(done/total*100):0);
  const addPct=addTotalCr?Math.round(addDoneCr/addTotalCr*100):0;

  if(pct===100&&S.lastPct<100)setTimeout(fireConfetti,50);
  S.lastPct=pct;

  const fbtns=`<button class="fbtn${!S.filter?' on':''}" data-a="filter" data-cat="">All</button>`+
    Object.entries(CATS).map(([k,v])=>{
      const on=S.filter===k;
      return `<button class="fbtn${on?' on':''}" data-a="filter" data-cat="${k}" style="${on?`background:${v.txt};color:${v.bg};border-color:${v.txt}`:`border-color:${v.txt};color:${v.txt}`}">${v.name}</button>`;

  const trackPill=act?`<div class="track-pill" onclick="S.modal='track';render()" title="${act.kind==='business'?'Business major track':'ECE Technical Component'}">

    ${rBanners()}

    <div class="hdr">

          <div style="margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">

              <span style="font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(act?.name||'')}</span>
              <span style="opacity:.7;font-size:10px">▾</span>

            ${trackPill}

            ${S.schedules.length>1?`<span style="font-size:10px;opacity:.6">${S.schedules.length} schedules</span>`:''}
            <span id="saved-stamp" class="saved-stamp" title="Autosaved to this browser">${S.lastSaved?'saved '+esc(relTime(S.lastSaved)):''}</span>

          <div class="stats">

          </div>
          <div class="hdr-btns">
            <button class="hbtn" onclick="S.modal='schedules';render()" title="Saved schedules (L)">📋 Schedules</button>
            <button class="hbtn" onclick="S.cmpPickId=null;S.modal='compare-pick';render()" title="Compare (C)">⇄ Compare</button>
            <button class="hbtn" onclick="S.modal='gpa';render()" title="GPA calculator (G)">📊 GPA</button>

    </div>
    ${rSelToolbar()}
    <nav class="nav">

  if(S.renamingId&&S.modal==='schedules')setTimeout(()=>{const el=document.getElementById('ren-inp');if(el){el.focus();el.select();}},50);
  if(S.modal==='search')setTimeout(()=>{const i=document.getElementById('search-inp');if(i&&document.activeElement!==i)i.focus();},0);
  if(S.modal==='programs')setTimeout(()=>{const i=document.getElementById('program-inp');if(i&&document.activeElement!==i)i.focus();},0);

// ─── Event delegation ─────────────────────────────────────────────────────────
function actionTarget(target){
  const el=target instanceof Element?target:target?.parentElement;
  return el?.closest('[data-a]')??null;
}
function mutate(fn,opts){
  pushHistory();
  fn();
  const last=loadSnapshots()[0];
  if(!last||Date.now()-last.ts>60000)saveSnapshotNow(opts?.reason||'auto');
  save();render();
}

document.addEventListener('click',e=>{
  if(e.target.id==='mbk'){S.modal=null;S.modalTab=null;S.renamingId=null;render();return;}
  const el=actionTarget(e.target);if(!el)return;
  const a=el.dataset.a,sem=el.dataset.sem,cid=el.dataset.cid;
  if(a==='filter')mutate(()=>S.filter=el.dataset.cat||null);
  else if(a==='hide-start-note'){
    const cb=document.getElementById('start-suppress');
    if(!cb||cb.checked)markStartSeen();
    S.startNote=false;render();
  }
  else if(a==='manual-update'){checkForUpdates(!S.startNote);}
  else if(a==='open-update-modal'){S.modal='update';render();}
  else if(a==='apply-update'){applyUpdate();}
  else if(a==='dismiss-update'){
    if(S.update?.latest){try{localStorage.setItem(UPDATE_DISMISS_KEY,S.update.latest);}catch(e){}}
    S.updateDismissed=true;render();
  }
  else if(a==='toggle-update-pref'){
    const pref=el.dataset.pref;
    if(!pref)return;
    const prefs=readAutoUpdatePrefs();
    prefs[pref]=!prefs[pref];
    writeAutoUpdatePrefs(prefs);
    render();
  }
  else if(a==='forget-update-file'){
    clearUpdateFileHandle().then(()=>render());
  }
  else if(a==='snooze-export'){
    writeExportSnooze(Date.now()+EXPORT_SNOOZE_DAYS*86400000);
    recomputeExportReminder();render();
  }
  else if(a==='open-backup'){S.modal='backup';render();}
  else if(a==='edit'){
    e.stopPropagation();
    const sems=getAS();const s=sems.find(x=>x.id===sem);const c=s?.courses.find(x=>x.id===cid);
    if(c){S.edit={semId:sem,courseId:cid,isNew:false};S.form={...c,semId:sem};render();window.scrollTo(0,0);}
  }
  else if(a==='add'){
    e.stopPropagation();
    S.edit={semId:sem,isNew:true};
    S.form={id:uid(),code:'',name:'',cat:getAct()?.kind==='business'?'BUSINESS':'ECE',credits:3,done:false,note:'',grade:'',semId:sem};
    render();window.scrollTo(0,0);
  }
  else if(a==='cancel'){S.edit=null;S.form={};render();}
  else if(a==='save'){
    const code=document.getElementById('f-code').value.trim();
    const name=document.getElementById('f-name').value.trim();
    if(!code||!name)return;
    const credits=hasCourseNumber(code)?parseCreditsFromCode(code):Math.max(0,parseInt(document.getElementById('f-credits').value)||0);
    const cat=document.getElementById('f-cat').value;
    const toSem=document.getElementById('f-sem').value;
    const note=document.getElementById('f-note').value.trim();
    const grade=document.getElementById('f-grade').value;
    const updated={id:S.form.id,code,name,credits,cat,done:S.form.done||false,note,grade};
    mutate(()=>{
      let sems=getAS();const from=S.edit.semId;
      if(S.edit.isNew){sems=sems.map(s=>s.id!==toSem?s:{...s,courses:[...s.courses,updated]});}
      else if(from===toSem){sems=sems.map(s=>s.id!==from?s:{...s,courses:s.courses.map(c=>c.id!==updated.id?c:updated)});}
      else{sems=sems.map(s=>{if(s.id===from)return{...s,courses:s.courses.filter(c=>c.id!==updated.id)};if(s.id===toSem)return{...s,courses:[...s.courses,updated]};return s;});}
      setAS(sems);S.edit=null;S.form={};
    });
  }
  else if(a==='del'){const{semId,courseId}=S.edit;mutate(()=>{setAS(getAS().map(s=>s.id!==semId?s:{...s,courses:s.courses.filter(c=>c.id!==courseId)}));S.edit=null;S.form={};});}
  else if(a==='delcourse'){
    e.stopPropagation();
    mutate(()=>{
      setAS(getAS().map(s=>s.id!==sem?s:{...s,courses:s.courses.filter(c=>c.id!==cid)}));
      if(S.edit?.courseId===cid){S.edit=null;S.form={};}
      if(S.selection.has(cid)){S.selection.delete(cid);if(!S.selection.size)S.selectionSem=null;}
    });
  }
  else if(a==='dsem'){mutate(()=>{setAS(getAS().filter(s=>s.id!==sem));if(S.edit?.semId===sem){S.edit=null;S.form={};}});}
  else if(a==='show-add-sem'){S.showAddSem=true;render();}
  else if(a==='addsem'){
    const n=document.getElementById('nsn')?.value.trim();
    if(!n){S.showAddSem=false;render();return;}
    const tpl=SEM_TEMPLATES[S.addSemKind]||SEM_TEMPLATES.normal;
    const newSem={id:'sem_'+Date.now(),label:n,courses:tpl.courses.map(c=>({...c,id:uid(),done:false})),isOff:!!tpl.isOff,offNote:tpl.offNote||''};
    mutate(()=>{setAS([...getAS(),newSem]);S.showAddSem=false;S.addSemKind='normal';});
  }
  else if(a==='cancelsem'){S.showAddSem=false;render();}
  else if(a==='close-modal'){S.modal=null;S.modalTab=null;S.renamingId=null;render();}
});

let _toggleLock=null;
function applyToggleDone(semId,cid){
  const key=semId+'\0'+cid;
  const now=Date.now();
  if(_toggleLock?.key===key&&now-_toggleLock.t<300)return;
  _toggleLock={key,t:now};
  mutate(()=>{
    setAS(getAS().map(s=>{
      if(s.id!==semId)return s;
      const idx=(s.courses||[]).findIndex(c=>c.id===cid);
      if(idx<0)return s;
      const courses=[...s.courses];
      courses[idx]={...courses[idx],done:!courses[idx].done};
      return{...s,courses};
    }));
  });
}

let dragScrollDir=0,dragScrollRAF=null;

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const t=e.target;const tag=t?.tagName;
  const inField=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t?.isContentEditable;
  if(e.key==='Escape'){
    if(document.getElementById('cg-pop')){closeGradePop();return;}
    if(S.modal){S.modal=null;S.modalTab=null;S.renamingId=null;render();}
    else if(S.selection.size)clearSel();
    else if(S.edit){S.edit=null;S.form={};render();}
    return;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&!inField){
    if(S.selection.size){bulkDelete();e.preventDefault();return;}
    if(S.edit&&!S.edit.isNew){
      const{semId,courseId}=S.edit;
      mutate(()=>{setAS(getAS().map(s=>s.id!==semId?s:{...s,courses:s.courses.filter(c=>c.id!==courseId)}));S.edit=null;S.form={};});
      e.preventDefault();return;
    }
  }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();return;}
  if(inField)return;
  if(S.modal||S.edit)return;
  const k=e.key.toLowerCase();
  if((e.key===' '||e.code==='Space')&&S.selection.size===1&&S.selectionSem){
    applyToggleDone(S.selectionSem,[...S.selection][0]);
    e.preventDefault();return;
  }
  if(k==='e'&&S.selection.size===1&&S.selectionSem){
    const semId=S.selectionSem,cid=[...S.selection][0];
    const c=getAS().find(s=>s.id===semId)?.courses.find(x=>x.id===cid);
    if(c){S.edit={semId,courseId:cid,isNew:false};S.form={...c,semId};render();window.scrollTo(0,0);}
    e.preventDefault();return;
  }
  if(k==='n'){const sems=getAS().filter(s=>!s.isOff);const target=(S.selectionSem&&sems.some(s=>s.id===S.selectionSem))?sems.find(s=>s.id===S.selectionSem):sems[0];if(target){S.edit={semId:target.id,isNew:true};S.form={id:uid(),code:'',name:'',cat:getAct()?.kind==='business'?'BUSINESS':'ECE',credits:3,done:false,note:'',grade:'',semId:target.id};render();window.scrollTo(0,0);}e.preventDefault();}
  else if(k==='c'){S.cmpPickId=null;S.modal='compare-pick';render();e.preventDefault();}
  else if(k==='s'){S.modal='search';render();e.preventDefault();}
  else if(k==='g'){S.modal='gpa';render();e.preventDefault();}
  else if(k==='t'){S.modal='track';render();e.preventDefault();}
  else if(k==='h'){S.modal='history';render();e.preventDefault();}
  else if(k==='l'){S.modal='schedules';render();e.preventDefault();}
  else if(k==='p'){window.print();e.preventDefault();}
  else if(e.key==='?'){S.modal='kbhelp';render();e.preventDefault();}
  else if(k>='1'&&k<='4'){
    const yrIdx=parseInt(k);const rowIds=layoutFor(getAct()).find(r=>r.label===`Year ${yrIdx}`)?.ids;
    if(rowIds){const el=document.getElementById('sc-'+rowIds[0]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
    e.preventDefault();
  }
});

// ─── Catalog autocomplete ────────────────────────────────────────────────────
// Lightweight popup wired to the edit panel "Code" input. Ranked match:
// exact code > code prefix > word prefix in name > substring.
function rankCatalog(q){
  q=q.trim().toUpperCase();if(!q)return[];
  const out=[];
  for(const e of CATALOG){
    const code=e.code.toUpperCase(),name=e.name.toUpperCase();
    let score=0;
    if(code===q)score=10;
    else if(code.startsWith(q))score=7;
    else if(code.replace(/\s+/g,'').startsWith(q.replace(/\s+/g,'')))score=6;
    else if(name.startsWith(q))score=4;
    else if(code.includes(q))score=3;
    else if(name.includes(q))score=2;
    if(score)out.push({e,score});
  }
  out.sort((a,b)=>b.score-a.score||a.e.code.localeCompare(b.e.code));
  return out.slice(0,8).map(x=>x.e);
}
let _acOpen=false,_acIdx=0;
function showAutocomplete(){
  const input=document.getElementById('f-code');if(!input)return;
  const q=input.value;
  const results=rankCatalog(q);
  let pop=document.getElementById('ac-pop');
  if(!q){if(pop)pop.remove();_acOpen=false;return;}
  if(!pop){pop=document.createElement('div');pop.id='ac-pop';pop.className='ac-pop';document.body.appendChild(pop);}
  const r=input.getBoundingClientRect();
  pop.style.left=(r.left+window.scrollX)+'px';
  pop.style.top=(r.bottom+window.scrollY+2)+'px';
  pop.style.width=Math.max(r.width,260)+'px';
  if(!results.length){pop.innerHTML='<div class="ac-empty">No catalog match. Type and save to add as a new course.</div>';_acOpen=true;return;}
  pop.innerHTML=results.map((e,i)=>`<div class="ac-row${i===_acIdx?' on':''}" data-i="${i}"><span class="ac-code">${esc(e.code)}</span><span class="ac-name">${esc(e.name)}</span><span class="ac-cr">${parseCreditsFromCode(e.code)}cr</span></div>`).join('');
  pop.querySelectorAll('.ac-row').forEach(row=>{

// ─── UT Direct transcript import ─────────────────────────────────────────────
// Permissive parser: scan lines for a course code + a grade. Updates matching
// courses in the active plan (sets done=true and grade). Lines that look like
// real courses but don't match anything in the plan get reported back so the
// user can add them.
function parseTranscript(text){
  // UT Academic Summary PDFs split most table rows across multiple lines:
  //   M 408C
  //   DIFFEREN AND INTEGRAL
  //   CALCULUS CR 26050
  //   Credit by
  //   exam 4.0 0.00
  // and even rows that fit on one printed line still have the 'Type' wrap below.
  // Strategy: a row starts when a line BEGINS with a course code. Continuation
  // lines (no leading code) get appended until the next code-starting line.
  // Grade is searched in the joined chunk, after the code, with +/- preserved.
  const lines=text.split(/[\r\n]+/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l);
  // Code at line start = real course row. Dept = 1-4 letters, optional second
  // word of 1-3 letters ('B A', 'A S'); number = optional 1-letter prefix
  // ('S' in 'S353'), 3 digits, optional 1-letter suffix.
  const lineCodeRe=/^([A-Z]{1,4}(?:\s+[A-Z]{1,3})?)\s+([A-Z]?)(\d{3})([A-Z]?)\b/;
  // Grades incl. CR/NC, W/Q/IP, and Z (in-progress) — Z maps to IP for GPA.
  // (?=\W|$) lookahead so 'A-' / 'B+' (whose suffix is non-word) match before a space.
  const gradeRe=/\b(A\+|A-|B\+|B-|C\+|C-|D\+|D-|A|B|C|D|F|CR|NC|W|Q|IP|Z)(?=\W|$)/;
  // Page/header lines that fall between row continuation lines — skip without
  // breaking the current row, since the PDF inserts them mid-row.
  const skipRe=/^(Academic Summary|Course\s+Title|Page \d|Total Hours|(Fall|Spring|Summer|Winter) \d{4} Courses?|(Lower|Upper) Division|Graduate Level|Overall|GPA|Grade Points|Hours:|Major \d|School \d|EID:|Name:|Classification:|Date Degree|First Semester|Last Semester)/i;
  const out=[];
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(lineCodeRe);
    if(!m)continue;
    const dept=m[1].replace(/\s+/g,' ').trim();
    const num=(m[2]||'')+m[3]+(m[4]||'');
    const code=`${dept} ${num}`;
    // Walk forward collecting continuation lines until we hit the next row-starting code.
    let chunk=lines[i].slice(m[0].length);
    let j=i+1;
    while(j<lines.length){
      const next=lines[j];
      if(lineCodeRe.test(next))break;
      if(skipRe.test(next)){j++;continue;}
      chunk+=' '+next;j++;
    }
    const mg=chunk.match(gradeRe);
    if(!mg)continue;
    let grade=mg[1];
    if(grade==='Z')grade='IP';
    // Try to pull credit hours from the chunk: UT rows end with '<credits> <grade points>'
    // like '3.0 6.99' or '1.0 0.00'. Search after the grade so we don't grab a unique ID.
    let credits=null;
    const afterGrade=chunk.slice(chunk.indexOf(mg[0])+mg[0].length);
    const mcr=afterGrade.match(/\b(\d+(?:\.\d+)?)\s+\d+\.\d{1,2}\b/);
    if(mcr)credits=parseFloat(mcr[1]);
    out.push({code,grade,credits,raw:(lines[i]+(chunk.trim()?' '+chunk.trim():'')).trim()});
  }
  return out;
}
// UT department → planner category, for auto-adding extra transcript courses.
// Lists below cover the most common UT depts a student sees on a transcript;
// anything not listed defaults to OTHER.
const DEPT_CAT={
  // Math + Statistics
  M:'MATH',STA:'MATH',
  // ECE
  ECE:'ECE',
  // Sciences (lab + lecture)
  PHY:'PHY',CH:'PHY',BIO:'PHY',AST:'PHY',GEO:'PHY',CHE:'PHY',
  // Business (McCombs)
  BA:'BUSINESS','B A':'BUSINESS',MAN:'BUSINESS',MKT:'BUSINESS',ACC:'BUSINESS',
  FIN:'BUSINESS',MIS:'BUSINESS',OM:'BUSINESS','O M':'BUSINESS',DS:'BUSINESS',
  'D S':'BUSINESS',LEB:'BUSINESS',BAX:'BUSINESS',IB:'BUSINESS','I B':'BUSINESS',
  ECO:'BUSINESS',BGS:'BUSINESS',
  // Core: humanities, history, gov, social/behavioral sciences, signature courses
  HIS:'CORE',GOV:'CORE',RHE:'CORE',E:'CORE',UGS:'CORE',
  PSY:'CORE',ANT:'CORE',SOC:'CORE',EDP:'CORE',GRG:'CORE',
  HDF:'CORE',LIN:'CORE',SW:'CORE',WGS:'CORE','A S':'CORE',ARC:'CORE',
  ARH:'CORE',ART:'CORE',MUS:'CORE','T D':'CORE',
  // Languages
  SPN:'OTHER',FR:'OTHER',GER:'OTHER',CHI:'OTHER',JPN:'OTHER',ITL:'OTHER',
};
function guessCategory(code){
  const norm=String(code||'').toUpperCase().replace(/\s+/g,'');
  const noSpace=norm.match(/^([A-Z]+)/)?.[1]||'';
  if(DEPT_CAT[noSpace])return DEPT_CAT[noSpace];
  // Try with internal space preserved (e.g. 'B A', 'O M', 'A S').
  const withSpace=String(code||'').toUpperCase().match(/^([A-Z]+(?:\s+[A-Z]+)?)/)?.[1]?.replace(/\s+/g,' ').trim()||'';
  if(DEPT_CAT[withSpace])return DEPT_CAT[withSpace];
  return 'OTHER';
}

function applyTranscript(parsed){
  // Aggressive normalization: uppercase, strip ALL whitespace, drop trailing H.
  //   'B A 324H' → 'BA324', 'BA 324H' → 'BA324', 'HIS 315K' → 'HIS315K', 'M 408C' → 'M408C'
  const normTight=s=>String(s||'').toUpperCase().replace(/\s+/g,'').replace(/H$/,'');
  // Dept prefix (letters before any digit), e.g. 'B A 324H' → 'BA', 'HIS' → 'HIS'.
  const deptOf=s=>{
    const m=String(s||'').toUpperCase().replace(/\s+/g,'').match(/^([A-Z]+)/);
    return m?m[1]:'';
  };
  // Pure placeholders (no digits) like 'HIS' or 'ANT/EDP/PSY/SOC' can match any
  // transcript course whose dept appears in the slash-list.
  const isPlaceholder=s=>!/\d/.test(String(s||''));
  const altsOf=s=>String(s||'').toUpperCase().split(/[\/,]/).map(part=>{
    const m=part.replace(/\s+/g,'').match(/^([A-Z]+)/);return m?m[1]:'';
  }).filter(Boolean);

  // Walk transcript entries once; for each, try to find an unfilled planner
  // slot using progressively looser criteria. Iteration order: transcript order
  // (semester chronological) → planner order (sem layout).
  const updates=parsed.map(p=>({
    norm:normTight(p.code),dept:deptOf(p.code),code:p.code,grade:p.grade,credits:p.credits,used:false,
  }));

  let matched=0,added=0;
  mutate(()=>{
    // Pass 1: walk planner sems and fill matching slots.
    const filled=getAS().map(sem=>{
      if(sem.isOff)return sem;
      return{...sem,courses:sem.courses.map(c=>{
        const cn=normTight(c.code);
        const cd=deptOf(c.code);
        // (1) Exact normalized code match: handles 'BA 324H' ↔ 'B A 324H',
        //     'ECE 302H' ↔ 'ECE 302H', etc. Whitespace and trailing H ignored.
        let upd=updates.find(u=>!u.used&&u.norm===cn);
        // (2) Number-prefix: planner 'E 316' matches transcript 'E 316P' (and
        //     any 'E 316X' variant). Requires planner code to be more specific
        //     than just a dept (cn.length must exceed dept length).
        if(!upd&&cn.length>cd.length)upd=updates.find(u=>!u.used&&u.norm.startsWith(cn));
        // (3) Dept-only placeholder: planner 'HIS' / 'ANT/EDP/PSY/SOC' fills
        //     with the first transcript course whose dept is in the alts list.
        if(!upd&&isPlaceholder(c.code)){
          const alts=altsOf(c.code);
          upd=updates.find(u=>!u.used&&alts.includes(u.dept));
        }
        if(upd){
          upd.used=true;matched++;
          const newCode=cn!==upd.norm?upd.code:c.code;
          return{...c,done:true,grade:upd.grade,code:newCode};
        }
        return c;
      })};
    });

    // Pass 2: dedupe — any transcript course whose code already exists somewhere
    // in the (just-filled) plan was implicitly matched and shouldn't be added again.
    const existingCodes=new Set(filled.flatMap(s=>s.courses).map(c=>normTight(c.code)));
    const leftover=updates.filter(u=>!u.used&&!existingCodes.has(u.norm));

    // Pass 3: bucket leftovers into an 'Imported credits' semester so they
    // count toward the user's total and show up in the Extra-credit bar.
    if(leftover.length){
      const newCourses=leftover.map(u=>({
        id:uid(),code:u.code,name:u.code,cat:guessCategory(u.code),
        credits:Number.isFinite(u.credits)?u.credits:3, // 0 is valid (UGS, A S 000C, etc.)
        done:true,grade:u.grade,note:'Imported from transcript',
      }));
      added=newCourses.length;
      const idx=filled.findIndex(s=>s.id==='imports');
      let withImports;
      if(idx>=0){
        withImports=filled.map(s=>s.id==='imports'?{...s,courses:[...s.courses,...newCourses]}:s);
      }else{
        withImports=[...filled,{id:'imports',label:'Imported transcript credits',courses:newCourses}];
      }
      setAS(withImports);
    }else{
      setAS(filled);
    }
  },{reason:'transcript-import'});

  return{matched,added,total:parsed.length,
    unmatched:updates.filter(u=>!u.used).map(u=>({code:u.code,grade:u.grade}))};
}

// ─── Touch drag (mobile) ─────────────────────────────────────────────────────
// HTML5 drag-and-drop does not fire on touchscreens. Long-press a card to
// start, drag a ghost element, drop on the target semester card.
let touchDrag=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.chk,.cacts,.cgrade,button'))return;
  const card=e.target.closest('.cc');if(!card)return;
  const semCard=card.closest('.sc');if(!semCard)return;
  const semId=semCard.id.replace(/^sc-/,'');
  // data-cid is on the chk element. Pull from there.
  const cidEl=card.querySelector('[data-cid]');if(!cidEl)return;
  const cid=cidEl.dataset.cid;
  touchDrag={semId,cid,el:card,started:false,timer:setTimeout(()=>{
    if(!touchDrag)return;
    touchDrag.started=true;
    card.classList.add('touching');
    if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}
    const sems=getAS();const c=sems.find(s=>s.id===semId)?.courses.find(x=>x.id===cid);
    if(c){
      if(S.selection.has(cid)&&S.selectionSem===semId&&S.selection.size>1){
        S.dragSrc={semId,courseId:cid,bulk:true,ids:[...S.selection]};
      }else{
        S.dragSrc={semId,courseId:cid,bulk:false};
      }
      const g=document.createElement('div');g.id='touch-ghost';g.className='touch-ghost';g.textContent=c.code;
      document.body.appendChild(g);
      const t=e.touches[0];g.style.left=t.clientX+'px';g.style.top=t.clientY+'px';
    }
  },380)};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touchDrag)return;
  const t=e.touches[0];
  // Cancel long-press if user starts scrolling before timer fires.
  if(!touchDrag.started){const dx=t.clientX-(touchDrag.x0||t.clientX),dy=t.clientY-(touchDrag.y0||t.clientY);if(!touchDrag.x0){touchDrag.x0=t.clientX;touchDrag.y0=t.clientY;}else if(Math.abs(dx)>10||Math.abs(dy)>10){clearTimeout(touchDrag.timer);touchDrag=null;}return;}
  e.preventDefault();
  const g=document.getElementById('touch-ghost');if(g){g.style.left=t.clientX+'px';g.style.top=t.clientY+'px';}
  // Highlight the semester under the touch.
  const under=document.elementFromPoint(t.clientX,t.clientY)?.closest('.sc');
  document.querySelectorAll('.sc.dov').forEach(el=>el.classList.remove('dov'));
  if(under&&under.id&&under.id!=='sc-'+touchDrag.semId)under.classList.add('dov');
  // Page edge auto-scroll.
  const vh=window.innerHeight,Z=80;
  if(t.clientY<Z)window.scrollBy(0,-10);
  else if(t.clientY>vh-Z)window.scrollBy(0,10);
},{passive:false});
document.addEventListener('touchend',e=>{
  if(!touchDrag){return;}
  clearTimeout(touchDrag.timer);
  const g=document.getElementById('touch-ghost');if(g)g.remove();
  touchDrag.el.classList.remove('touching');
  if(touchDrag.started){
    const t=e.changedTouches[0];
    const under=document.elementFromPoint(t.clientX,t.clientY)?.closest('.sc');
    document.querySelectorAll('.sc.dov').forEach(el=>el.classList.remove('dov'));
    if(under&&under.id&&under.id!=='sc-'+touchDrag.semId){
      const target=under.id.replace(/^sc-/,'');
      window.wDrop(target);
    }else{S.dragSrc=null;}
  }
  touchDrag=null;
},{passive:true});

// ─── Custom drag preview ─────────────────────────────────────────────────────
// Replaces the browser's default drag ghost with a small canvas-rendered chip.
window.wDSCustom=(semId,courseId,e)=>{
  if(e?.target?.closest?.('.chk,.cacts,.cgrade,button')){e.preventDefault();return false;}
  try{
    if(e&&e.dataTransfer&&e.dataTransfer.setDragImage){
      const sems=getAS();const c=sems.find(s=>s.id===semId)?.courses.find(x=>x.id===courseId);
      const label=c?`${c.code}`:'';
      const N=S.selection.has(courseId)&&S.selectionSem===semId?S.selection.size:1;
      const text=N>1?`${label} +${N-1}`:label;
      const cv=document.createElement('canvas');
      const W=200,H=36;cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';
      const ctx=cv.getContext('2d');ctx.scale(2,2);
      ctx.fillStyle='#BF3A1F';ctx.strokeStyle='#8A2010';
      ctx.beginPath();ctx.roundRect?ctx.roundRect(1,1,W-2,H-2,7):ctx.rect(1,1,W-2,H-2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='600 13px -apple-system,Segoe UI,sans-serif';
      ctx.textBaseline='middle';ctx.fillText(text,12,H/2);
      // Off-screen attach is required for Safari/Chrome to honor the bitmap.
      cv.style.position='absolute';cv.style.left='-9999px';document.body.appendChild(cv);
      e.dataTransfer.setDragImage(cv,20,18);
      setTimeout(()=>cv.remove(),0);
    }
  }catch(_){}
  return window.wDS(semId,courseId);
};

// ─── Targeted search update (no full re-render on keystrokes) ────────────────
function computeSearchResultsHtml(){
  const q=(S.searchQ||'').trim().toLowerCase();
  if(!q)return'<div class="sres-empty">Type a course code or name above.</div>';
  // Ranked: exact code > prefix > code substring > name match.
  const out=[];
  for(const sch of S.schedules)for(const sem of sch.sems)for(const c of sem.courses){
    const code=c.code.toLowerCase(),name=c.name.toLowerCase();
    let score=0;
    if(code===q)score=10;
    else if(code.startsWith(q))score=6;
    else if(code.includes(q))score=4;
    else if(name.startsWith(q))score=3;
    else if(name.includes(q))score=1;
    if(score)out.push({sch,sem,c,score});
  }
  if(!out.length)return'<div class="sres-empty">No matches.</div>';
  out.sort((a,b)=>b.score-a.score);
  return `<div class="sres">${out.slice(0,80).map(r=>`
    <div class="sres-row" onclick="jumpTo('${r.sch.id}','${r.sem.id}','${r.c.id}')">
      <span class="sr-code" style="color:${(CATS[r.c.cat]||CATS.OTHER).txt}">${esc(r.c.code)}</span>
      <span class="sr-name">${esc(r.c.name)}</span>
      <span class="sr-loc">${esc(r.sch.name)} · ${esc(r.sem.label)}</span>
    </div>`).join('')}</div>`;
}

  loadUpdateFileHandle().catch(()=>{});
  setupAutoUpdateScheduler();
  setInterval(()=>{
    const stamp=document.getElementById('saved-stamp');
    if(stamp&&S.lastSaved)stamp.textContent='saved '+relTime(S.lastSaved);
    const prev=S.exportReminder;recomputeExportReminder();
    if(prev!==S.exportReminder)render();
  },30000);
  if('requestIdleCallback'in window)requestIdleCallback(prewarmModals,{timeout:2000});
  else setTimeout(prewarmModals,500);
})();
</script>
</body>
</html>
